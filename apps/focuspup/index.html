<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusPup | TechMood</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f4eb;color:#234438;font:17px system-ui}main{max-width:480px;margin:auto;padding:24px}header,nav{display:flex;justify-content:space-between;gap:8px;align-items:center}section{background:white;border-radius:28px;padding:24px;margin:20px 0;text-align:center}button,select{font:inherit;border:0;border-radius:16px;padding:12px;background:#dce9d7;color:inherit;cursor:pointer}button.primary{background:#234438;color:white;width:100%}h1{font-size:25px}#clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}.dog{font-size:90px}.walking{animation:walk .7s infinite alternate}@keyframes walk{to{transform:translateY(-8px) rotate(5deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}nav{position:sticky;bottom:0;background:#f5f4eb;padding:12px 0}small{opacity:.7}body.dark{background:#182820;color:#e4eedc}body.dark section{background:#293d32}body.dark button{color:#234438}</style><main><header><h1>FocusPup 🐾</h1><span id="balance"></span><button onclick="lang()">EN/ع</button><button onclick="document.body.classList.toggle('dark')">◐</button></header><div id="view"></div><nav id="nav"></nav><small>TechMood Technology</small></main><script>let s;try{s=JSON.parse(localStorage.fp)}catch{}s=s||{bones:0,dog:0,park:[],toys:[],minutes:0,days:[],en:false};let page=0,dogs=['🐶','🐕','🦮','🐩'],names=['Buddy','Max','Sunny','Coco'],duration=25,left=1500,end=0,mode='focus';const t=(a,b)=>s.en?b:a,save=()=>localStorage.fp=JSON.stringify(s),v=document.getElementById('view');function lang(){s.en=!s.en;save();render()}function go(n){page=n;render()}function render(){document.documentElement.dir=s.en?'ltr':'rtl';document.getElementById('balance').textContent='🦴 '+s.bones;document.getElementById('nav').innerHTML=[t('تركيز','Focus'),t('الكلاب','Pups'),t('الحديقة','Park'),t('المتجر','Shop'),t('تقدم','Stats')].map((x,i)=>'<button onclick="go('+i+')">'+x+'</button>').join('');if(page===0)v.innerHTML='<section><small>'+t('وقت للتركيز','Time to focus')+'</small><div class="dog '+(end?'walking':'')+'">'+dogs[s.dog]+'</div><div id="clock"></div><select onchange="choose(this.value)" '+(end?'disabled':'')+'>'+[5,15,25,50].map(n=>'<option '+(n===duration?'selected':'')+'>'+n+'</option>').join('')+'</select> <button onclick="rest()">'+t('استراحة','Break')+'</button><p><button class="primary" onclick="toggle()">'+(end?t('إيقاف مؤقت','Pause'):t('ابدأ / تابع','Start / resume'))+'</button></p><button onclick="reset()">'+t('إلغاء','Reset')+'</button></section>';if(page===1)v.innerHTML='<section><h2>'+t('اختر صديقك','Choose your pup')+'</h2>'+dogs.map((d,i)=>'<p><button onclick="pick('+i+')">'+d+' '+names[i]+(s.dog===i?' ✓':'')+'</button></p>').join('')+'</section>';if(page===2)v.innerHTML='<section><h2>🌳 '+t('حديقة الكلاب','Dog park')+'</h2><p style="font-size:44px">'+s.park.map(i=>dogs[i]).join(' ')+'</p><p>'+t('جلسات مكتملة','Completed sessions')+': '+s.park.length+'</p></section>';if(page===3)v.innerHTML='<section><h2>'+t('متجر الألعاب','Toy shop')+'</h2>'+['🎾','🥏','🧸'].map((d,i)=>'<p>'+d+' <button onclick="buy('+i+')">'+(s.toys.includes(i)?'✓':(i+1)*5+' 🦴')+'</button></p>').join('')+'</section>';if(page===4)v.innerHTML='<section><h2>'+t('إنجازاتك','Your progress')+'</h2><h1>'+s.minutes+' '+t('دقيقة','minutes')+'</h1><progress max="60" value="'+Math.min(60,s.minutes)+'"></progress><p>'+t('أيام النشاط','Active days')+': '+s.days.length+'</p></section>';tick()}function pick(i){if(!end){s.dog=i;save();render()}}function buy(i){let cost=(i+1)*5;if(!s.toys.includes(i)&&s.bones>=cost){s.bones-=cost;s.toys.push(i);save();render()}}function choose(n){duration=+n;left=duration*60;mode='focus';render()}function rest(){if(!end){mode='break';duration=5;left=300;render()}}function reset(){end=0;left=duration*60;render()}function toggle(){if(end){left=Math.max(0,Math.ceil((end-Date.now())/1000));end=0}else{end=Date.now()+left*1000}render()}function tick(){if(end){left=Math.max(0,Math.ceil((end-Date.now())/1000));if(!left){end=0;let reward=mode==='focus'?Math.floor(duration/5):0;if(mode==='focus'){s.bones+=reward;s.minutes+=duration;s.park.push(s.dog);let day=new Date().toLocaleDateString('en-CA');if(!s.days.includes(day))s.days.push(day);save()}left=duration*60;page=5;render();v.innerHTML='<section><div class="dog">🎉'+dogs[s.dog]+'</div><h2>'+t('أحسنت!','Great job!')+'</h2><p>+'+reward+' 🦴</p><button onclick="go(0)">'+t('متابعة','Continue')+'</button></section>';return}}let c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}setInterval(tick,250);render()</script></html>
