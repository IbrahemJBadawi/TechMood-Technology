<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusPup | TechMood</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"><style>:root{--bg:#F7FAFF;--panel:white;--ink:#071C2B;--muted:#526273;--blue:#007BFF;--line:#e1eaf4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px 'IBM Plex Sans Arabic','Space Grotesk',sans-serif}main{max-width:760px;margin:auto;padding:24px 20px 100px}header,nav{display:flex;justify-content:space-between;gap:8px;align-items:center}header{padding:12px 0 24px}h1{font-family:'Space Grotesk',sans-serif;font-size:26px;letter-spacing:-1px;margin:0}h2{margin:0 0 16px}section{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;margin:16px 0;text-align:center;box-shadow:0 12px 40px #0b438a09}button,select{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--panel);color:inherit;cursor:pointer;transition:transform .18s,background .18s}button:active{transform:scale(.96)}button.primary{background:linear-gradient(110deg,#0052CC,#007BFF);color:white;width:100%;border:0;box-shadow:0 8px 22px #007bff30}#clock{font:700 72px 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-4px;direction:ltr;margin:8px 0 18px}.dog{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#d4edff,#eaf4ff 65%,transparent 66%);margin:12px auto;max-width:340px}.dog svg{width:155px;height:155px;filter:drop-shadow(0 12px 5px #44729920)}.walking svg{animation:walk .7s infinite alternate}@keyframes walk{to{transform:translateY(-8px) rotate(3deg)}}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:var(--panel);padding:12px 8px max(12px,env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px #071c2b09;z-index:2}nav button{flex:1;border:0;background:transparent;padding:9px 2px;font-size:12px;display:grid;justify-items:center;gap:5px;color:var(--muted)}nav button.active{background:#eaf4ff;color:#0052cc}nav svg{width:23px;height:23px}small{color:var(--muted)}body.dark{--bg:#03070D;--panel:#0D1522;--ink:#F5F9FF;--muted:#A8B6C7;--line:#253244}body.dark .dog{background:radial-gradient(ellipse,#163954,#10283f 65%,transparent 66%)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:400px){main{padding:14px 12px 95px}section{padding:20px}header button{padding:8px}#clock{font-size:64px}}</style><main><header><h1>FocusPup</h1><span id="balance"></span><button onclick="lang()">EN/ع</button><button onclick="document.body.classList.toggle('dark')">◐</button></header><div id="view"></div><nav id="nav"></nav><small>TechMood Technology</small></main><script>let s;try{s=JSON.parse(localStorage.fp)}catch{}s=s||{bones:0,dog:0,park:[],toys:[],minutes:0,days:[],en:false};function pup(i){let colors=['#C98B55','#AB795D','#E9B85F','#9DAEC6'];return '<svg viewBox="0 0 180 160" xmlns="http://www.w3.org/2000/svg"><ellipse cx="90" cy="145" rx="58" ry="8" fill="#87B8D6" opacity=".25"/><path d="M48 109 Q20 91 26 75" fill="none" stroke="'+colors[i]+'" stroke-width="14" stroke-linecap="round"/><rect x="43" y="81" width="91" height="55" rx="28" fill="'+colors[i]+'"/><rect x="51" y="115" width="19" height="28" rx="9" fill="'+colors[i]+'"/><rect x="111" y="115" width="19" height="28" rx="9" fill="'+colors[i]+'"/><path d="M54 59 L43 10 Q68 6 78 39 M126 59 L139 10 Q114 6 104 39" fill="'+colors[i]+'"/><rect x="49" y="35" width="84" height="72" rx="35" fill="'+colors[i]+'"/><ellipse cx="91" cy="84" rx="27" ry="20" fill="#FFF2DF"/><circle cx="70" cy="63" r="4" fill="#071C2B"/><circle cx="112" cy="63" r="4" fill="#071C2B"/><ellipse cx="91" cy="76" rx="7" ry="5" fill="#071C2B"/><path d="M84 87 Q91 94 98 87" stroke="#071C2B" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M65 105 Q91 116 117 105" stroke="#007BFF" stroke-width="7" fill="none"/><circle cx="91" cy="114" r="6" fill="#38BDF8"/></svg>'}const icons=['<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>','<circle cx="5" cy="8" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="15" cy="5" r="2"/><circle cx="19" cy="9" r="2"/><path d="M7 17q5-10 10 0q0 5-5 2q-5 3-5-2"/>','<path d="M12 2 5 12h4l-5 6h16l-5-6h4zM12 18v4"/>','<path d="M3 8h18l-2 13H5zM8 8a4 4 0 0 1 8 0"/>','<path d="M4 20V10M12 20V4M20 20v-7"/>'];function icon(i){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[i]+'</svg>'};let page=0,dogs=[0,1,2,3].map(pup),names=['Buddy','Max','Sunny','Coco'],duration=25,left=1500,end=0,mode='focus';const t=(a,b)=>s.en?b:a,save=()=>localStorage.fp=JSON.stringify(s),v=document.getElementById('view');function lang(){s.en=!s.en;save();render()}function go(n){page=n;render()}function render(){document.documentElement.dir=s.en?'ltr':'rtl';document.getElementById('balance').textContent='🦴 '+s.bones;document.getElementById('nav').innerHTML=[t('تركيز','Focus'),t('الكلاب','Pups'),t('الحديقة','Park'),t('المتجر','Shop'),t('تقدم','Stats')].map((x,i)=>'<button class="'+(page===i?'active':'')+'" onclick="go('+i+')">'+icon(i)+x+'</button>').join('');if(page===0)v.innerHTML='<section><small>'+t('وقت للتركيز','Time to focus')+'</small><div class="dog '+(end?'walking':'')+'">'+dogs[s.dog]+'</div><div id="clock"></div><select onchange="choose(this.value)" '+(end?'disabled':'')+'>'+[5,15,25,50].map(n=>'<option '+(n===duration?'selected':'')+'>'+n+'</option>').join('')+'</select> <button onclick="rest()">'+t('استراحة','Break')+'</button><p><button class="primary" onclick="toggle()">'+(end?t('إيقاف مؤقت','Pause'):t('ابدأ / تابع','Start / resume'))+'</button></p><button onclick="reset()">'+t('إلغاء','Reset')+'</button></section>';if(page===1)v.innerHTML='<section><h2>'+t('اختر صديقك','Choose your pup')+'</h2>'+dogs.map((d,i)=>'<p><button onclick="pick('+i+')">'+'<span style="display:inline-block;width:70px;vertical-align:middle">'+d+'</span>'+' '+names[i]+(s.dog===i?' ✓':'')+'</button></p>').join('')+'</section>';if(page===2)v.innerHTML='<section><h2>🌳 '+t('حديقة الكلاب','Dog park')+'</h2><p style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+s.park.map(i=>dogs[i]).join(' ')+'</p><p>'+t('جلسات مكتملة','Completed sessions')+': '+s.park.length+'</p></section>';if(page===3)v.innerHTML='<section><h2>'+t('متجر الألعاب','Toy shop')+'</h2>'+['🎾','🥏','🧸'].map((d,i)=>'<p>'+d+' <button onclick="buy('+i+')">'+(s.toys.includes(i)?'✓':(i+1)*5+' 🦴')+'</button></p>').join('')+'</section>';if(page===4)v.innerHTML='<section><h2>'+t('إنجازاتك','Your progress')+'</h2><h1>'+s.minutes+' '+t('دقيقة','minutes')+'</h1><progress max="60" value="'+Math.min(60,s.minutes)+'"></progress><p>'+t('أيام النشاط','Active days')+': '+s.days.length+'</p></section>';tick()}function pick(i){if(!end){s.dog=i;save();render()}}function buy(i){let cost=(i+1)*5;if(!s.toys.includes(i)&&s.bones>=cost){s.bones-=cost;s.toys.push(i);save();render()}}function choose(n){duration=+n;left=duration*60;mode='focus';render()}function rest(){if(!end){mode='break';duration=5;left=300;render()}}function reset(){end=0;left=duration*60;render()}function toggle(){if(end){left=Math.max(0,Math.ceil((end-Date.now())/1000));end=0}else{end=Date.now()+left*1000}render()}function tick(){if(end){left=Math.max(0,Math.ceil((end-Date.now())/1000));if(!left){end=0;let reward=mode==='focus'?Math.floor(duration/5):0;if(mode==='focus'){s.bones+=reward;s.minutes+=duration;s.park.push(s.dog);let day=new Date().toLocaleDateString('en-CA');if(!s.days.includes(day))s.days.push(day);save()}left=duration*60;page=5;render();v.innerHTML='<section><div class="dog">'+dogs[s.dog]+'</div><h2>'+t('أحسنت!','Great job!')+'</h2><p>+'+reward+' 🦴</p><button onclick="go(0)">'+t('متابعة','Continue')+'</button></section>';return}}let c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}setInterval(tick,250);render()</script></html>
