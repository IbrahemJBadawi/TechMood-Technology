function studio(){const p=state.posts.find(x=>x.id===editing)||{title:'',category:'',body:'',question:'',reference:'',tags:'',date:'',time:'08:00',channel:'Telegram',status:'draft'};root.innerHTML='<div class="section-head"><div><h1>محرر المحتوى</h1><p class="muted">اكتب أو حرّر منشورك وعاين شكله قبل النشر.</p></div></div><div class="cols"><section class="panel"><form id="post-form"><div class="formgrid"><div class="field"><label for="category">التصنيف</label><input id="category" value="'+esc(p.category)+'" placeholder="💡 معرفة رقمية"></div><div class="field"><label for="channel">القناة</label><select id="channel">'+['Telegram','Facebook','LinkedIn','Instagram','X','YouTube'].map(x=>'<option '+(x===p.channel?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="field"><label for="title">العنوان *</label><input id="title" required maxlength="160" value="'+esc(p.title)+'"></div><div class="field"><label for="body">المتن * <small id="words"></small></label><textarea id="body" required maxlength="12000">'+esc(p.body)+'</textarea></div><div class="field"><label for="question">سؤال تفاعلي</label><input id="question" value="'+esc(p.question)+'"></div><div class="field"><label for="reference">اسم المرجع والرابط</label><textarea id="reference" style="min-height:70px">'+esc(p.reference)+'</textarea></div><div class="field"><label for="tags">الهاشتاغات</label><input id="tags" value="'+esc(p.tags)+'"></div><div class="formgrid"><div class="field"><label for="date">تاريخ النشر المخطط</label><input type="date" id="date" value="'+esc(p.date)+'"></div><div class="field"><label for="time">الوقت المحلي</label><input type="time" id="time" value="'+esc(p.time||'08:00')+'"></div></div><div class="notice">الجدولة هنا تخطيط فقط، لا ترسل رسالة تلقائيًا. المنطقة الزمنية: '+esc(state.settings.timezone)+'</div><div class="actions"><button class="btn primary" type="submit">حفظ المسودة</button><button class="btn" id="schedule" type="button">حفظ في التقويم</button><button class="btn" id="outline" type="button">إضافة قالب فارغ</button></div></form></section><aside><section class="panel"><div class="preview-head"><img src="./mark.svg" alt=""><div><b>'+esc(state.brand.name)+'</b><br><small>معاينة المنشور</small></div></div><div class="preview" id="preview"></div><div class="actions" style="margin-top:13px"><button class="btn" id="copy">نسخ النص</button><button class="btn" id="mark">تسجيل كنشر يدوي</button></div></section></aside></div>';
const draft=()=>Object.fromEntries(['title','category','body','question','reference','tags','date','time','channel'].map(k=>[k,$(k).value.trim()]));function preview(){const d=draft();$('preview').textContent=format(d)||'ستظهر معاينة المحتوى هنا.';$('words').textContent=' · '+(d.body?d.body.split(/\s+/u).length:0)+' كلمة'}root.querySelectorAll('input,textarea,select').forEach(x=>x.oninput=preview);preview();function save(status){if(!$('post-form').reportValidity())return;if(status==='scheduled'&&(!$('date').value||!$('time').value)){notify('حدد تاريخًا ووقتًا للتخطيط.');return}const record={...draft(),id:editing||crypto.randomUUID(),status,updated:new Date().toISOString()};const i=state.posts.findIndex(x=>x.id===record.id);if(i>=0)state.posts[i]=record;else state.posts.push(record);editing=record.id;persist();notify(status==='scheduled'?'تم حفظ الموعد المخطط':status==='published'?'تم تسجيل النشر اليدوي':'تم حفظ المسودة');go(status==='scheduled'?'calendar':'library')}$('post-form').onsubmit=e=>{e.preventDefault();save('draft')};$('schedule').onclick=()=>save('scheduled');$('mark').onclick=()=>{if(confirm('هل نشرت المحتوى بنفسك بالفعل؟ هذا الزر لا ينشر خارجيًا.'))save('published')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(format(draft()));notify('تم نسخ النص')}catch{notify('حدد النص من المعاينة وانسخه يدويًا.')}};$('outline').onclick=()=>{if($('body').value&&!confirm('استبدال المتن بقالب فارغ؟'))return;$('body').value='[عرّف الفكرة في جملة واضحة]\n[اشرح فائدتها وتطبيقها العملي]\n[اختم بخلاصة معرفية]';preview()}}
function library(){root.innerHTML='<section class="panel"><div class="section-head"><h2>مكتبة المحتوى</h2><button class="btn primary" id="lib-new">منشور جديد</button></div><div class="filters"><input id="search" placeholder="ابحث في المنشورات" value="'+esc(query)+'"><select id="status-filter"><option value="all">كل الحالات</option>'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(filter===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div id="list"></div></section>';const show=()=>{$('list').innerHTML=items(state.posts.filter(p=>(filter==='all'||p.status===filter)&&[p.title,p.body,p.category].join(' ').toLowerCase().includes(query.toLowerCase())).reverse());bindItems()};$('search').oninput=e=>{query=e.target.value;show()};$('status-filter').onchange=e=>{filter=e.target.value;show()};$('lib-new').onclick=()=>go('studio');show()}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=new Date();const pad=n=>String(n).padStart(2,'0');root.innerHTML='<section class="panel"><div class="section-head"><div><h2>تقويم المحتوى</h2><small>مواعيد مخططة محليًا · لا إرسال تلقائي</small></div><div class="actions"><button class="btn icon" id="prev" aria-label="الشهر السابق">›</button><b>'+esc(month.toLocaleDateString('ar',{month:'long',year:'numeric'}))+'</b><button class="btn icon" id="next" aria-label="الشهر التالي">‹</button></div></div><div class="calendar">'+['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'].map(x=>'<div class="weekday">'+x+'</div>').join('')+'<div class="day blank"></div>'.repeat(start)+Array.from({length:days},(_,i)=>{let d=i+1,key=y+'-'+pad(m+1)+'-'+pad(d);return '<button class="day '+(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d?'now':'')+'" data-date="'+key+'"><b>'+d+'</b>'+state.posts.filter(p=>p.date===key).slice(0,3).map(p=>'<span class="event">'+esc(p.title)+'</span>').join('')+'</button>'}).join('')+'</div></section><section class="panel"><h2>منشورات هذا الشهر</h2>'+items(state.posts.filter(p=>p.date?.startsWith(y+'-'+pad(m+1))))+'</section>';$('prev').onclick=()=>{month=new Date(y,m-1,1);calendar()};$('next').onclick=()=>{month=new Date(y,m+1,1);calendar()};root.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const d=b.dataset.date,p=state.posts.find(x=>x.date===d);go('studio',p?.id||null);if(!p){$('date').value=d}});bindItems()}
const platforms=['Telegram','Facebook','LinkedIn','Instagram','X','YouTube'];function channels(){root.innerHTML='<section class="panel"><div class="section-head"><div><h2>قنوات النشر</h2><p class="muted">حفظ عناوين القنوات محليًا فقط.</p></div></div><div class="notice">لا يتم ربط الحسابات أو حفظ التوكنات في هذه النسخة. لا تدخل مفاتيح API هنا.</div><div class="platforms">'+platforms.map(p=>'<div class="platform"><div class="symbol">'+icon(p==='Telegram'?'send':'channels')+'</div><h3 class="en">'+p+'</h3><p>'+esc(state.channels[p]||'لم يتم تحديد قناة')+'</p><span class="pill">'+(state.channels[p]?'عنوان محفوظ':'غير مرتبط')+'</span><button class="btn" data-channel="'+p+'">تعديل العنوان</button></div>').join('')+'</div></section>';root.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{const p=b.dataset.channel,v=prompt('رابط القناة أو اسم المستخدم (بدون أي مفتاح سري)',state.channels[p]||'');if(v!==null){state.channels[p]=v.slice(0,250);persist();channels()}})}
function brand(){root.innerHTML='<section class="panel"><h2>الهوية التحريرية</h2><p class="muted">خصّص اسم المساحة وأسلوبك وتذييل المنشورات.</p><form id="brand-form" style="margin-top:16px"><div class="formgrid"><div class="field"><label for="brand-name">اسم مساحة العمل</label><input id="brand-name" required value="'+esc(state.brand.name)+'"></div><div class="field"><label for="brand-tone">الأسلوب التحريري</label><input id="brand-tone" value="'+esc(state.brand.tone)+'"></div></div><div class="field"><label for="brand-topics">المجالات والموضوعات</label><textarea id="brand-topics">'+esc(state.brand.topics)+'</textarea></div><div class="field"><label for="brand-footer">التوقيع والروابط</label><textarea id="brand-footer">'+esc(state.brand.footer)+'</textarea></div><button class="btn primary">حفظ الهوية</button></form></section>';$('brand-form').onsubmit=e=>{e.preventDefault();state.brand={...state.brand,name:$('brand-name').value.trim(),tone:$('brand-tone').value.trim(),topics:$('brand-topics').value.trim(),footer:$('brand-footer').value.trim()};persist();notify('تم حفظ الهوية')}}
function settings(){root.innerHTML='<section class="panel"><h2>الإعدادات</h2><p class="muted">إدارة مساحة العمل المحلية والنسخ الاحتياطية.</p><div class="field" style="margin-top:15px"><label for="tz">المنطقة الزمنية للتخطيط</label><input id="tz" value="'+esc(state.settings.timezone)+'"></div><div class="actions"><button class="btn primary" id="save-settings">حفظ</button><button class="btn" id="open-brand">الهوية التحريرية</button><button class="btn" id="open-channels">القنوات</button></div></section><section class="panel"><h2>نسخة احتياطية</h2><p class="muted">صدّر بياناتك بصيغة JSON أو استورد نسخة سابقة.</p><div class="actions" style="margin-top:12px"><button class="btn" id="export">تصدير البيانات</button><button class="btn" id="import-btn">استيراد البيانات</button><button class="btn danger" id="reset">مسح البيانات المحلية</button></div></section><section class="panel"><h2>الذكاء الاصطناعي والأتمتة</h2><div class="notice">غير متصل بالخادم. سيتم تفعيل التوليد والجدولة الخارجية بعد ربط حسابات آمنة وقاعدة بيانات مستقلة. لا توجد تكاليف API في هذه النسخة.</div></section>';$('save-settings').onclick=()=>{try{new Intl.DateTimeFormat('en',{timeZone:$('tz').value.trim()}).format();state.settings.timezone=$('tz').value.trim();persist();notify('تم حفظ الإعدادات')}catch{notify('أدخل منطقة زمنية صحيحة مثل Asia/Hebron')}};$('open-brand').onclick=()=>go('brand');$('open-channels').onclick=()=>go('channels');$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='publishermood-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import-btn').onclick=()=>$('import').click();$('reset').onclick=()=>{if(confirm('هل تريد حذف جميع بيانات PublisherMood على هذا الجهاز؟')){state=defaults();persist();theme();go('home')}}}
$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5000000)throw Error();const x=JSON.parse(await f.text());if(!Array.isArray(x.posts)||!x.brand||!x.channels||!x.settings||x.posts.some(p=>!p||typeof p.id!=='string'||typeof p.title!=='string'||typeof p.body!=='string'||!Object.hasOwn(labels,p.status)))throw Error();if(confirm('استبدال البيانات المحلية بهذه النسخة؟')){state={...defaults(),...x};persist();theme();go('home');notify('تم الاستيراد')}}catch{notify('ملف غير صالح')}finally{e.target.value=''}};
function render(){nav();$('page-title').textContent=pages.find(x=>x[0]===page)[1];({home,studio,library,calendar,channels,brand,settings})[page]();root.insertAdjacentHTML('beforeend','<footer class="footer">PublisherMood · <a href="https://techmood-technology-corporate.vercel.app/">TechMood Technology</a> · Local MVP</footer>')}theme();page=pages.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'home';render();window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==page&&pages.some(x=>x[0]===p)){page=p;editing=null;render()}});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
